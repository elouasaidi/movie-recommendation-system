<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Formulaire de Connexion Utilisateur</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style-LR.css') }}">
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="{{ url_for('static', filename='script.js') }}"></script>
</head>
<body>    
<div class="container">
    <div class="message signup">
        
    <h2>Connexion Utilisateur</h2>
    <form id="login-form" action="{{ url_for('login') }}" method="post"  >
        {% if message is defined and message %}
            <div class="alert alert-warning alert-dismissible fade show" role="alert">
                {{ message }}
                <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
        {% endif %}
        <div id="alert-message" class="alert alert-success alert-dismissible fade show" role="alert" style="display: none;">
            <!-- Le message d'alerte sera ajouté ici par JavaScript -->
            <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                <span aria-hidden="true">&times;</span>
            </button>
        </div>
        <div class="form-group">
            <label for="email">Email :</label>
            <input type="email" class="form-control" id="email" name="email" placeholder="Entrez votre adresse email" name="email">
        </div>
        <div class="form-group">
            <label for="pwd">Mot de passe :</label>
            <input type="password" class="form-control" id="password" name="password" placeholder="Entrez votre mot de passe" name="pswd">
        </div>    
        <button type="submit" class="btn btn-primary">Connexion</button>
        <p class="bottom">Vous n'avez pas de compte ? <a id="login" class="bottom" href="{{url_for('register')}}"> Inscrivez-vous ici</a></p>
    </form>
</div>




</body>
</html>
