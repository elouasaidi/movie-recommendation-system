<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Formulaire d'inscription utilisateur</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style-LR.css') }}">
<script src="{{ url_for('static', filename='script.js') }}"></script>
</head>
<body>
<div class="container">
	<h2>Inscription utilisateur</h2>
	<form action="{{ url_for('register') }}" method="post">
        {% if message is defined and message %}
            <div class="alert alert-warning alert-dismissible fade show" role="alert">
                {{ message }}
                <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
        {% endif %}
		<div id="alert-message" class="alert alert-success alert-dismissible fade show" role="alert" style="display: none;">
			<!-- Le message d'alerte sera ajouté ici par JavaScript -->
			<button type="button" class="close" data-dismiss="alert" aria-label="Close">
				<span aria-hidden="true">&times;</span>
			</button>
		</div>
		<div class="form-group">
			<label for="name">Nom :</label>
			<input type="text" class="form-control" id="name" name="name" placeholder="Entrez votre nom" name="name">
		</div>
		<div class="form-group">
			<label for="email">Email :</label>
			<input type="email" class="form-control" id="email" name="email" placeholder="Entrez votre email" name="email">
		</div>
		<div class="form-group">
			<label for="pwd">Mot de passe :</label>
			<input type="password" class="form-control" id="password" name="password" placeholder="Entrez votre mot de passe" name="pswd">
		</div>    
		<button type="submit" class="btn btn-primary">S'inscrire</button>
		<p class="bottom">Vous avez déjà un compte ?  <a id="signup" class="bottom" href="{{url_for('login')}}"> Connectez-vous ici</a></p>
	</form>
</div>        
</body>
</html>
